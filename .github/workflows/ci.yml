name: Offline evaluation checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest==8.4.2
      - run: python -m pytest tests/offline -q
